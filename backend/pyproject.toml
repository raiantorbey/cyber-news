[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signalwatch-backend"
version = "0.1.0"
description = "SignalWatch cybersecurity intelligence API and ingestion worker"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "bleach>=6.1,<7",
  "fastapi>=0.115,<1",
  "feedparser>=6.0,<7",
  "httpx>=0.27,<1",
  "pillow>=10.4,<12",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
signalwatch-ingest = "app.cli:main"
signalwatch-worker = "app.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
